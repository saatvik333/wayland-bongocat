name: Publish to AUR

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Generate PKGBUILD
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          URL="https://github.com/saatvik333/wayland-bongocat/archive/refs/tags/${TAG}.tar.gz"

          curl -fsSL "$URL" -o release.tar.gz
          SHA256=$(sha256sum release.tar.gz | cut -d' ' -f1)
          SRCDIR=$(tar -tzf release.tar.gz | sed -n '1s|/.*||p')

          cat > PKGBUILD <<PKGBUILD_EOF
          # Maintainer: saatvik333 <saatvik333sharma@gmail.com>
          pkgname=bongocat
          pkgver=${VERSION}
          _tag=${TAG}
          _srcdir=${SRCDIR}
          pkgrel=1
          pkgdesc="Delightful Wayland overlay that displays an animated bongo cat reacting to keyboard input"
          arch=('x86_64' 'aarch64')
          url="https://github.com/saatvik333/wayland-bongocat"
          license=('MIT')
          depends=('wayland')
          makedepends=('make' 'gcc')
          source=("\$pkgname-\$pkgver.tar.gz::\$url/archive/refs/tags/\$_tag.tar.gz")
          sha256sums=('${SHA256}')

          build() {
            cd "\$_srcdir"
            make release
          }

          package() {
            cd "\$_srcdir"
            install -Dm755 build/release/bongocat "\$pkgdir/usr/bin/bongocat"
            install -Dm644 LICENSE "\$pkgdir/usr/share/licenses/\$pkgname/LICENSE"
            install -Dm644 bongocat.conf.example "\$pkgdir/usr/share/doc/\$pkgname/bongocat.conf.example"
            install -Dm644 man/bongocat.1 "\$pkgdir/usr/share/man/man1/bongocat.1"
          }
          PKGBUILD_EOF

          # Strip leading whitespace from heredoc indentation
          sed -i 's/^          //' PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@abe8ac26b51011c88be58c8809fd2ac674068ea5 # v4.1.2
        with:
          pkgname: bongocat
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ github.event.release.tag_name }}"
          force_push: false
